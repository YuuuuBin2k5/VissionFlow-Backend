name: VisionFlow free short-form render

# Render Free cannot host an always-on background worker. This intentionally
# manual runner processes a small, operator-approved batch on GitHub-hosted
# infrastructure using the same Control Plane, Redis Stream and R2 contracts.
on:
  workflow_dispatch:
    inputs:
      confirmed:
        description: "Type RENDER to acknowledge this can call AI providers and create real media artifacts."
        required: true
        type: string
      passes:
        description: "Relay/worker passes (1-3). Two passes normally cover plan then render."
        required: true
        default: "3"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [trigger-render]

permissions:
  contents: read

concurrency:
  group: visionflow-free-short-render
  cancel-in-progress: false

jobs:
  render-approved-work:
    if: ${{ inputs.confirmed == 'RENDER' || github.event_name == 'schedule' || github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.VISIONFLOW_DATABASE_URL }}
      REDIS_URL: ${{ secrets.VISIONFLOW_REDIS_URL }}
      VISIONFLOW_CONTROL_PLANE_URL: ${{ secrets.VISIONFLOW_CONTROL_PLANE_URL }}
      VISIONFLOW_WORKER_CLIENT_ID: ${{ secrets.VISIONFLOW_WORKER_CLIENT_ID }}
      VISIONFLOW_WORKER_CLIENT_SECRET: ${{ secrets.VISIONFLOW_WORKER_CLIENT_SECRET }}
      VISIONFLOW_PUBLISHER_CLIENT_ID: ${{ secrets.VISIONFLOW_PUBLISHER_CLIENT_ID }}
      VISIONFLOW_PUBLISHER_CLIENT_SECRET: ${{ secrets.VISIONFLOW_PUBLISHER_CLIENT_SECRET }}
      VISIONFLOW_ORGANIZATION_ID: ${{ secrets.VISIONFLOW_ORGANIZATION_ID }}
      VISIONFLOW_AUTH_AUDIENCE: visionflow-control-plane
      VISIONFLOW_OBJECT_STORE_ENDPOINT: ${{ secrets.VISIONFLOW_OBJECT_STORE_ENDPOINT }}
      VISIONFLOW_OBJECT_STORE_BUCKET: ${{ secrets.VISIONFLOW_OBJECT_STORE_BUCKET }}
      VISIONFLOW_OBJECT_STORE_ACCESS_KEY_ID: ${{ secrets.VISIONFLOW_OBJECT_STORE_ACCESS_KEY_ID }}
      VISIONFLOW_OBJECT_STORE_SECRET_ACCESS_KEY: ${{ secrets.VISIONFLOW_OBJECT_STORE_SECRET_ACCESS_KEY }}
      VISIONFLOW_OBJECT_STORE_REGION: auto
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify render runner configuration
        shell: bash
        run: |
          required=(DATABASE_URL REDIS_URL VISIONFLOW_CONTROL_PLANE_URL VISIONFLOW_WORKER_CLIENT_ID VISIONFLOW_WORKER_CLIENT_SECRET VISIONFLOW_ORGANIZATION_ID VISIONFLOW_OBJECT_STORE_ENDPOINT VISIONFLOW_OBJECT_STORE_BUCKET VISIONFLOW_OBJECT_STORE_ACCESS_KEY_ID VISIONFLOW_OBJECT_STORE_SECRET_ACCESS_KEY)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret: $name"
              exit 1
            fi
          done
          export VISIONFLOW_TOKEN_URL="${VISIONFLOW_CONTROL_PLANE_URL%/}/auth/token"
          printf 'VISIONFLOW_TOKEN_URL=%s\n' "$VISIONFLOW_TOKEN_URL" >> "$GITHUB_ENV"

      - name: Install relay and render dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip && python -m pip install -r services/control-plane/requirements.txt -r worker/requirements.txt
          python -m playwright install chromium --with-deps

      - name: Cleanup stale test AI Dubbing workflows
        shell: bash
        run: |
          echo "Cleaning up stale test dubbing workflows..."
          PYTHONPATH=services/control-plane python services/control-plane/scripts/cleanup_stale_dubbing_workflows.py --delete || true

      - name: Reset workflows stuck in RENDERING or ASSETS_READY
        shell: bash
        run: |
          echo "Resetting RENDERING/ASSETS_READY workflows..."
          python services/control-plane/scripts/reset_stuck_rendering.py --all || true

      - name: Auto-requeue QUEUED standard workflows into Redis (skips AI Dubbing jobs)
        shell: bash
        run: |
          echo "Checking for QUEUED standard workflows stuck in Redis..."
          python services/control-plane/scripts/requeue_workflow.py --all || true

      - name: Advance workflows stuck in PLANNING state (worker crashed mid-intelligence)
        shell: bash
        run: |
          echo "Checking for PLANNING workflows stuck mid-intelligence..."
          python services/control-plane/scripts/advance_stuck_workflow.py --all || true

      - name: Relay and execute bounded short-form work
        shell: bash
        run: |
          for ((pass=1; pass<=${{ inputs.passes || '3' }}; pass++)); do
            echo "============================================"
            echo "Starting VisionFlow relay/worker pass $pass"
            echo "============================================"
            python worker/process_queued_jobs.py || true
            python services/control-plane/scripts/reset_stuck_rendering.py --all || true
            python services/control-plane/scripts/advance_stuck_workflow.py --all || true
            python services/control-plane/scripts/requeue_workflow.py --all || true
            python services/control-plane/scripts/relay_outbox.py --limit 10
            python worker/consume_visionflow_events.py --once --block-ms 1000 --count 10
            echo "Pass $pass complete"
          done

          # Persist final QA/review state events (e.g. APPROVAL_PENDING)
          echo "Final relay pass..."
          python services/control-plane/scripts/relay_outbox.py --limit 10
          echo "Executing publisher consumer for requested publication attempts..."
          python services/publisher-worker/consumer.py --once || true
          echo "Done."
