name: VisionFlow Control Plane CI

on:
  pull_request:
    paths:
      - "services/control-plane/**"
      - ".github/workflows/visionflow-control-plane-ci.yml"
  push:
    branches:
      - main
    paths:
      - "services/control-plane/**"
      - ".github/workflows/visionflow-control-plane-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control-plane/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Verify style, syntax, domain policy and configuration guards
        run: |
          python -m ruff check app alembic tests
          python -m compileall -q app alembic tests
          python -m unittest discover -s tests -v
      - name: Verify SQLAlchemy metadata imports
        run: python -c "from app.infrastructure.models import Base; print(sorted(Base.metadata.tables))"
      - name: Verify container build
        working-directory: ${{ github.workspace }}
        run: docker build --file services/control-plane/Dockerfile --tag visionflow-control-plane:ci .
