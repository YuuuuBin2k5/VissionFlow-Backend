name: VisionFlow Publisher Worker CI

on:
  pull_request:
    paths:
      - 'services/publisher-worker/**'
      - '.github/workflows/visionflow-publisher-ci.yml'
  push:
    branches: [production]
    paths:
      - 'services/publisher-worker/**'
      - '.github/workflows/visionflow-publisher-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/publisher-worker
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/publisher-worker/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify worker contracts
        run: python -m unittest discover -s tests -v
