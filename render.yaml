# Default Render Blueprint: free preview (one web service only).
# The paid/staging topology with two persistent workers is in
# render.staging.yaml and must be selected intentionally later.
services:
  - type: web
    runtime: docker
    name: visionflow-control-plane-free
    region: singapore
    plan: free
    dockerfilePath: services/control-plane/Dockerfile
    dockerCommand: sh entrypoint.sh
    healthCheckPath: /api/v1/health
    # Render Free does not support preDeployCommand. Run the one-time Alembic
    # migration from a trusted local machine before registering the first user.
    envVars:
      - key: APP_ENV
        value: preview
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: VISIONFLOW_TAILSCALE_ENABLED
        value: "false"
      - key: VISIONFLOW_TRUST_LOCAL_DB_PROXY
        value: "false"
      - key: TAILSCALE_AUTHKEY
        sync: false
      - key: TAILSCALE_HOSTNAME
        value: visionflow-render
      - key: TAILSCALE_TAGS
        value: tag:visionflow-render
      - key: VISIONFLOW_TAILSCALE_DB_HOST
        value: visionflow-db
      - key: VISIONFLOW_TAILSCALE_DB_PORT
        value: "5432"
      - key: REDIS_URL
        sync: false
      - key: VISIONFLOW_WEB_ORIGINS
        value: https://vision-flow-console.vercel.app
      - key: VISIONFLOW_AUTH_ISSUER
        sync: false
      - key: VISIONFLOW_AUTH_AUDIENCE
        value: visionflow-control-plane
      - key: VISIONFLOW_AUTH_KEY_ID
        value: visionflow-preview-2026-01
      - key: VISIONFLOW_AUTH_PRIVATE_KEY_PEM_BASE64
        sync: false
      - key: VISIONFLOW_AUTH_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: VISIONFLOW_AUTH_REFRESH_TOKEN_TTL_DAYS
        value: "14"
      - key: VISIONFLOW_WORKER_CLIENT_ID
        sync: false
      - key: VISIONFLOW_WORKER_CLIENT_SECRET
        sync: false
      - key: VISIONFLOW_WORKER_SUBJECT
        value: service|visionflow-intelligence-worker
