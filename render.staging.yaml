services:
  - type: web
    runtime: docker
    name: visionflow-control-plane-staging
    region: singapore
    dockerfilePath: services/control-plane/Dockerfile
    dockerCommand: sh entrypoint.sh
    healthCheckPath: /api/v1/health
    # entrypoint.sh starts the optional Tailscale transport before Alembic.
    # A Render pre-deploy command cannot use that process-local tunnel.
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: staging
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: VISIONFLOW_TAILSCALE_ENABLED
        value: "false"
      - key: VISIONFLOW_TRUST_LOCAL_DB_PROXY
        value: "false"
      - key: TAILSCALE_AUTHKEY
        sync: false
      - key: TAILSCALE_HOSTNAME
        value: visionflow-render-staging
      - key: TAILSCALE_TAGS
        value: tag:visionflow-render
      - key: VISIONFLOW_TAILSCALE_DB_HOST
        value: visionflow-db
      - key: VISIONFLOW_TAILSCALE_DB_PORT
        value: "5432"
      - key: REDIS_URL
        sync: false
      - key: VISIONFLOW_WEB_ORIGINS
        value: https://vision-flow-console.vercel.app
      - key: VISIONFLOW_AUTH_ISSUER
        sync: false
      - key: VISIONFLOW_AUTH_AUDIENCE
        value: visionflow-control-plane
      - key: VISIONFLOW_AUTH_KEY_ID
        value: visionflow-2026-01
      - key: VISIONFLOW_AUTH_PRIVATE_KEY_PEM_BASE64
        sync: false
      - key: VISIONFLOW_AUTH_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: VISIONFLOW_AUTH_REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: VISIONFLOW_WORKER_CLIENT_ID
        sync: false
      - key: VISIONFLOW_WORKER_CLIENT_SECRET
        sync: false
      - key: VISIONFLOW_WORKER_SUBJECT
        value: service|visionflow-intelligence-worker
      - key: VISIONFLOW_OBJECT_STORE_ENDPOINT
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_BUCKET
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_ACCESS_KEY_ID
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_SECRET_ACCESS_KEY
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_REGION
        value: auto
  - type: worker
    runtime: docker
    name: visionflow-outbox-relay-staging
    region: singapore
    dockerfilePath: services/control-plane/Dockerfile
    dockerCommand: python scripts/run_outbox_relay.py
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
  - type: worker
    runtime: docker
    name: visionflow-youtube-publisher-staging
    region: singapore
    dockerfilePath: services/publisher-worker/Dockerfile
    maxShutdownDelaySeconds: 600
    envVars:
      - key: REDIS_URL
        sync: false
      - key: VISIONFLOW_CONTROL_PLANE_URL
        sync: false
      - key: VISIONFLOW_AUTH_AUDIENCE
        value: visionflow-control-plane
      - key: VISIONFLOW_PUBLISHER_CLIENT_ID
        sync: false
      - key: VISIONFLOW_PUBLISHER_CLIENT_SECRET
        sync: false
      - key: VISIONFLOW_PUBLISHER_SUBJECT
        value: service|visionflow-publisher
      - key: VISIONFLOW_PUBLISHER_WORKER_SUBJECT
        value: service|visionflow-publisher
  - type: worker
    runtime: docker
    name: visionflow-intelligence-worker-staging
    region: singapore
    dockerfilePath: worker/Dockerfile
    maxShutdownDelaySeconds: 300
    envVars:
      - key: REDIS_URL
        sync: false
      - key: VISIONFLOW_CONTROL_PLANE_URL
        sync: false
      - key: VISIONFLOW_ORGANIZATION_ID
        sync: false
      - key: VISIONFLOW_TOKEN_URL
        sync: false
      - key: VISIONFLOW_WORKER_CLIENT_ID
        sync: false
      - key: VISIONFLOW_WORKER_CLIENT_SECRET
        sync: false
      - key: VISIONFLOW_AUTH_AUDIENCE
        value: visionflow-control-plane
      - key: VISIONFLOW_OBJECT_STORE_ENDPOINT
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_BUCKET
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_ACCESS_KEY_ID
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_SECRET_ACCESS_KEY
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_REGION
        value: auto
