services:
  mysql:
    image: mysql:8.0
    container_name: tiktok_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-YOUR_DB_PASSWORD_HERE}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-tiktok_agent_automation_db}"
      MYSQL_USER: "${MYSQL_USER:-tiktok_user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-tiktok_password}"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - tiktok_network

  redis:
    image: redis:7.0-alpine
    container_name: tiktok_redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - tiktok_network

volumes:
  mysql_data:
  redis_data:

networks:
  tiktok_network:
    driver: bridge
