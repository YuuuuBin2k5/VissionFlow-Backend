# VisionFlow Free Preview profile.
#
# Render does not offer Free instances for Background Workers.  This blueprint
# intentionally deploys only the Control Plane. Run relay_outbox.py and
# consume_visionflow_events.py locally (or on a paid worker) for real renders.
services:
  - type: web
    runtime: docker
    name: visionflow-control-plane-free
    region: singapore
    plan: free
    dockerfilePath: services/control-plane/Dockerfile
    dockerCommand: sh entrypoint.sh
    healthCheckPath: /api/v1/health
    # Render Free does not support preDeployCommand. Run the one-time Alembic
    # migration from a trusted local machine before registering the first user.
    envVars:
      - key: APP_ENV
        value: preview
      - key: API_PREFIX
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: VISIONFLOW_TAILSCALE_ENABLED
        value: "false"
      - key: VISIONFLOW_TRUST_LOCAL_DB_PROXY
        value: "false"
      - key: TAILSCALE_AUTHKEY
        sync: false
      - key: TAILSCALE_HOSTNAME
        value: visionflow-render
      - key: TAILSCALE_TAGS
        value: tag:visionflow-render
      - key: VISIONFLOW_TAILSCALE_DB_HOST
        value: visionflow-db
      - key: VISIONFLOW_TAILSCALE_DB_PORT
        value: "5432"
      # Use an external durable free Redis provider (for example, Upstash).
      # Render Free Key Value is in-memory only and may lose queued work.
      - key: REDIS_URL
        sync: false
      - key: VISIONFLOW_WEB_ORIGINS
        value: https://vision-flow-console.vercel.app
      - key: VISIONFLOW_AUTH_ISSUER
        sync: false
      - key: VISIONFLOW_AUTH_AUDIENCE
        value: visionflow-control-plane
      - key: VISIONFLOW_AUTH_KEY_ID
        value: visionflow-preview-2026-01
      - key: VISIONFLOW_AUTH_PRIVATE_KEY_PEM_BASE64
        sync: false
      - key: VISIONFLOW_AUTH_ACCESS_TOKEN_TTL_SECONDS
        value: "900"
      - key: VISIONFLOW_AUTH_REFRESH_TOKEN_TTL_DAYS
        value: "14"
      - key: VISIONFLOW_WORKER_CLIENT_ID
        sync: false
      - key: VISIONFLOW_WORKER_CLIENT_SECRET
        sync: false
      - key: VISIONFLOW_WORKER_SUBJECT
        value: service|visionflow-intelligence-worker
      # Required only for browser overlay uploads. The free profile cannot run
      # the intelligence worker, so uploaded overlays render only after a
      # paid worker or local worker consumes the workflow event.
      - key: VISIONFLOW_OBJECT_STORE_ENDPOINT
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_BUCKET
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_ACCESS_KEY_ID
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_SECRET_ACCESS_KEY
        sync: false
      - key: VISIONFLOW_OBJECT_STORE_REGION
        value: auto
