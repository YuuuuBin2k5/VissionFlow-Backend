[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF"]

ignore = [
    "E402",   # module level import not at top of file
    "E501",   # line too long
    "E701",   # multiple statements on one line (colon)
    "E702",   # multiple statements on one line (semicolon)
    "B008",   # FastAPI Depends(), Query(), Header() in function defaults
    "B017",   # blind except: Exception
    "B904",   # raise ... from err in except clause
    "SIM102", # nested if statements
    "SIM105", # try-except-pass vs contextlib.suppress
    "SIM117", # nested with statements
    "RUF005", # consider unpacked list instead of concatenation
    "RUF007", # prefer itertools.pairwise
    "RUF012", # mutable default value for class attribute
    "RUF059", # unpacked variable unused
]

[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = [
    "I001",
    "F401",
]

"tests/**/*.py" = [
    "I001",
    "F401",
    "B905",
    "RUF100",
]
